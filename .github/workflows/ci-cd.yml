name: Dashboard CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dashboard-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.DEPLOY_AWS_REGION }}
  DEPLOY_BUCKET: ${{ vars.DEPLOY_S3_BUCKET }}
  DEPLOY_PREFIX: ${{ vars.DEPLOY_S3_PREFIX }}
  EC2_INSTANCE_ID: i-0534e7ed9423fff65

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    environment: production
    env:
      PREVIEW_ALLOWED_HOSTS: ${{ vars.VITE_PREVIEW_ALLOWED_HOSTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            eks-dashboard-backend/package-lock.json
            eks-dashboard-frontend/package-lock.json

      - name: Install and test backend
        working-directory: eks-dashboard-backend
        run: |
          npm ci
          npm test -- --runInBand
          npm run build

      - name: Install and build frontend
        working-directory: eks-dashboard-frontend
        run: |
          npm ci
          npm run build

      - name: Create release archive
        id: package
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "build-release/eks-dashboard-backend" "build-release/eks-dashboard-frontend"
          cp -a eks-dashboard-backend/dist build-release/eks-dashboard-backend/
          cp eks-dashboard-backend/package.json eks-dashboard-backend/package-lock.json build-release/eks-dashboard-backend/
          cp -a eks-dashboard-frontend/dist build-release/eks-dashboard-frontend/
          cp eks-dashboard-frontend/package.json eks-dashboard-frontend/package-lock.json build-release/eks-dashboard-frontend/
          cp eks-dashboard-frontend/vite.config.ts build-release/eks-dashboard-frontend/
          cp ecosystem.prod.config.js build-release/
          tar -czf "dashboard-${RELEASE_ID}.tar.gz" -C build-release .
          SHA256=$(sha256sum "dashboard-${RELEASE_ID}.tar.gz" | awk '{print $1}')
          SCRIPT_SHA256=$(sha256sum scripts/deploy-release.sh | awk '{print $1}')
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "archive=dashboard-${RELEASE_ID}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "script_sha256=${SCRIPT_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Validate production environment configuration
        run: |
          set -euo pipefail
          test -n "$AWS_REGION" || { echo "DEPLOY_AWS_REGION is not configured" >&2; exit 1; }
          test -n "$DEPLOY_BUCKET" || { echo "DEPLOY_S3_BUCKET is not configured" >&2; exit 1; }
          test -n "$DEPLOY_PREFIX" || { echo "DEPLOY_S3_PREFIX is not configured" >&2; exit 1; }

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload release to S3
        env:
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          SCRIPT_SHA256: ${{ steps.package.outputs.script_sha256 }}
        run: |
          set -euo pipefail
          test -n "$AWS_REGION"
          test -n "$DEPLOY_BUCKET"
          test -n "$DEPLOY_PREFIX"
          S3_BASE="s3://${DEPLOY_BUCKET}/${DEPLOY_PREFIX%/}/${RELEASE_ID}"
          aws s3 cp "$ARCHIVE" "$S3_BASE/$ARCHIVE" --sse AES256
          aws s3 cp scripts/deploy-release.sh "$S3_BASE/deploy-release.sh" --sse AES256
          echo "$S3_BASE/$ARCHIVE" > /tmp/dashboard-artifact-uri
          echo "$S3_BASE/deploy-release.sh" > /tmp/dashboard-script-uri
          echo "$SHA256" > /tmp/dashboard-sha256

      - name: Deploy through SSM
        env:
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          SCRIPT_SHA256: ${{ steps.package.outputs.script_sha256 }}
        run: |
          set -euo pipefail
          PREVIEW_ALLOWED_HOSTS="${PREVIEW_ALLOWED_HOSTS:-www.pree.mg56.net}"
          [[ "$PREVIEW_ALLOWED_HOSTS" =~ ^[A-Za-z0-9._,-]+$ ]] || {
            echo "VITE_PREVIEW_ALLOWED_HOSTS contains unsupported characters" >&2
            exit 1
          }
          S3_BASE="s3://${DEPLOY_BUCKET}/${DEPLOY_PREFIX%/}/${RELEASE_ID}"
          SCRIPT_URI="$S3_BASE/deploy-release.sh"
          ARTIFACT_URI="$S3_BASE/$ARCHIVE"
          SSM_COMMAND="set -e
          export VITE_PREVIEW_ALLOWED_HOSTS='$PREVIEW_ALLOWED_HOSTS'
          install -d -m 0755 /opt/dashboard/scripts
          aws s3 cp '$SCRIPT_URI' /opt/dashboard/scripts/deploy-release.sh --only-show-errors
          echo '$SCRIPT_SHA256  /opt/dashboard/scripts/deploy-release.sh' | sha256sum -c -
          chmod 0755 /opt/dashboard/scripts/deploy-release.sh
          /opt/dashboard/scripts/deploy-release.sh --artifact-uri '$ARTIFACT_URI' --release-id '$RELEASE_ID' --sha256 '$SHA256'"
          printf '%s' "$SSM_COMMAND" | jq -Rs '{commands: [. | rtrimstr("\\n")]}' > "$RUNNER_TEMP/dashboard-ssm-parameters.json"
          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "dashboard deploy $RELEASE_ID" \
            --parameters "file://$RUNNER_TEMP/dashboard-ssm-parameters.json" \
            --query 'Command.CommandId' --output text)
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
          WAIT_STATUS=$?
          set -e
          INVOCATION=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID")
          echo "$INVOCATION" | jq '{Status,StatusDetails,ResponseCode:(.ResponseCode // null),Output:(.StandardOutputContent // ""),Error:(.StandardErrorContent // "")}'
          STATUS=$(echo "$INVOCATION" | jq -r '.Status')
          if [[ "$WAIT_STATUS" -ne 0 || "$STATUS" != "Success" ]]; then
            echo "SSM deployment failed with status: $STATUS" >&2
            exit 1
          fi
