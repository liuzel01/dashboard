modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      follow_redirects: true
      preferred_ip_protocol: ip4
  http_reachable:
    prober: http
    timeout: 10s
    http:
      follow_redirects: true
      preferred_ip_protocol: ip4
      valid_status_codes:
        - 200
        - 400
        - 401
        - 403
        - 404
        - 405
        - 431
