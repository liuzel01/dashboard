apiVersion: v1
kind: Service
metadata:
  name: dashboard-blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: dashboard-blackbox-exporter
    app.kubernetes.io/part-of: dashboard
spec:
  ports:
    - name: http
      port: 9115
      protocol: TCP
      targetPort: 9115
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: dashboard-blackbox-exporter
  namespace: monitoring
  labels:
    kubernetes.io/service-name: dashboard-blackbox-exporter
    app.kubernetes.io/name: dashboard-blackbox-exporter
    app.kubernetes.io/part-of: dashboard
addressType: IPv4
endpoints:
  - addresses:
      - 10.100.166.109
ports:
  - name: http
    protocol: TCP
    port: 9115
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: dashboard-external-dependencies
  namespace: monitoring
  labels:
    role: probe
    app.kubernetes.io/name: dashboard-external-dependencies
    app.kubernetes.io/part-of: dashboard
spec:
  jobName: dashboard-external-dependencies
  interval: 60s
  scrapeTimeout: 10s
  module: http_2xx
  prober:
    url: dashboard-blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      labels:
        owner: dashboard
        probe_location: mgbx-prometheus
      static:
        - http://10.100.166.109:5173/
        - http://10.100.166.109:3000/api/oncall/health
        - http://10.2.0.116:8080/login
        - http://10.100.174.192:8080/login
        - http://172.31.18.229:8080/login
        - http://10.80.160.79:8080/login
        - http://172.31.29.3:3000/api/probes/latest
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dashboard-external-dependencies
  namespace: monitoring
  labels:
    role: alert-rules
    prometheus: k8s
    app.kubernetes.io/name: dashboard-external-dependencies
    app.kubernetes.io/part-of: dashboard
spec:
  groups:
    - name: dashboard-external-dependencies
      rules:
        - alert: DashboardExternalDependencyUnavailable
          expr: probe_success{job=~"dashboard-external-dependencies.*"} == 0
          for: 3m
          labels:
            severity: warning
            risk_level: medium
            service: dashboard-external-dependencies
          annotations:
            summary: "Dashboard 外部依赖探测失败"
            description: "探测目标 {{ $labels.instance }} 已连续 3 分钟不可用，请在 Dashboard 外部依赖健康页面查看详情。"
        - alert: DashboardBlackboxExporterUnavailable
          expr: min(up{job=~"dashboard-external-dependencies.*"}) == 0 or absent(up{job=~"dashboard-external-dependencies.*"})
          for: 3m
          labels:
            severity: warning
            risk_level: medium
            service: dashboard-blackbox-exporter
          annotations:
            summary: "Dashboard Blackbox Exporter 不可用"
            description: "Prometheus 已连续 3 分钟无法正常采集 Dashboard Blackbox Exporter，请检查 EC2 容器、端口 9115 和安全组。"
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: dashboard-external-dependencies-reachable
  namespace: monitoring
  labels:
    role: probe
    app.kubernetes.io/name: dashboard-external-dependencies-reachable
    app.kubernetes.io/part-of: dashboard
spec:
  jobName: dashboard-external-dependencies-reachable
  interval: 60s
  scrapeTimeout: 15s
  module: http_reachable
  prober:
    url: dashboard-blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      labels:
        owner: dashboard
        probe_location: mgbx-prometheus
      static:
        - https://open.chinanetcenter.com
        - https://git.megadevapp.com/api/v4/version
        - http://10.90.0.13:8317/v1/models
        - https://grafana.pre.mg56.net/api/health
        - https://dcdn.aliyuncs.com
        - https://esa.cn-hangzhou.aliyuncs.com
        - http://52.198.75.133:8005/signin
