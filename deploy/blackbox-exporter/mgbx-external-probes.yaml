apiVersion: v1
kind: Service
metadata:
  name: dashboard-blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: dashboard-blackbox-exporter
    app.kubernetes.io/part-of: dashboard
spec:
  ports:
    - name: http
      port: 9115
      protocol: TCP
      targetPort: 9115
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: dashboard-blackbox-exporter
  namespace: monitoring
  labels:
    kubernetes.io/service-name: dashboard-blackbox-exporter
    app.kubernetes.io/name: dashboard-blackbox-exporter
    app.kubernetes.io/part-of: dashboard
addressType: IPv4
endpoints:
  - addresses:
      - 10.100.166.109
ports:
  - name: http
    protocol: TCP
    port: 9115
