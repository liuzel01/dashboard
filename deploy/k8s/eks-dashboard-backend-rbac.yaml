apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eks-dashboard-backend
  labels:
    app.kubernetes.io/name: eks-dashboard
    app.kubernetes.io/part-of: dashboard
rules:
  # Dashboard deployment list/restart/rollback and rollout diagnostics.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]

  # Pod status, events, and log streaming used by the deployment UI.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]

  # Service discovery and Kubernetes API service-proxy forwarding.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get"]

  # Direct ingress inspection/creation used by line onboarding features.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create"]

  # Read-only conflict checks for the monitoring request workflow.
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eks-dashboard-backend
  labels:
    app.kubernetes.io/name: eks-dashboard
    app.kubernetes.io/part-of: dashboard
subjects:
  # This group must match the kubernetesGroups value on the EKS Access Entry
  # used by the Dashboard backend IAM principal.
  - kind: Group
    name: mgbx-eks-dashboard
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: eks-dashboard-backend
  apiGroup: rbac.authorization.k8s.io
