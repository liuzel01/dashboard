apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-db-gateway-agent-config
  namespace: default
  labels:
    app.kubernetes.io/name: dashboard-db-gateway-agent
    app.kubernetes.io/part-of: dashboard
data:
  LOG_LEVEL: "info"
  PORT: "8080"
  AGENT_ENVIRONMENT_ID: "hashex"
  AWS_REGION: "ap-east-1"
  CONFIG_CACHE_TTL_MS: "300000"
  QUERY_TIMEOUT_MS: "15000"
  DB_READONLY_DEFAULT: "true"
  AGENT_SHARED_TOKEN: "tgS6trgOonYNdLsbfrgEH9yIwTY2KtUG"
  AGENT_DECRYPT_PROVIDER: "kms"
  AGENT_KMS_VALUE_PREFIX: "{kms-app}"
  AGENT_KMS_DECRYPT_TIMEOUT_MS: "8000"

  # KMS decrypt context for this single-environment agent deployment.
  KMS_KEY_ALIAS: "alias/kms-eks-hash"
  KMS_CONTEXT: '{"Environment":"hash","Source":"backend","DataType":"config-password"}'

  # Dedicated datasource configs for dashboard-db-gateway-agent.
  datasource.url: "jdbc:mysql://meganew.c786smwyy2x7.ap-southeast-1.rds.amazonaws.com/spot?useUnicode=true&characterEncoding=utf-8&serverTimeZone=UTC&allowMultiQueries=true&&useSSL=false"
  datasource.username: "megauuusss"
  datasource.password: "Q9#vE8mT!2xPa4Hr"

  redis.host: "master.megatiger.ijxpl8.apse1.cache.amazonaws.com"
  redis.port: "6379"
  redis.database: "0"
  redis.ssl: "true"
  redis.password: "NKA*cme2p#1sAsaznlyy12"

  mongo.uri: "mongodb://megauuaa:KA*cme2pqg@172.31.23.137:27017,172.31.22.44:27017,172.31.27.168:27017/spot?replicaSet=mongo-repl&readPreference=secondaryPreferred&ssl=false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-db-gateway-agent
  namespace: default
  labels:
    app.kubernetes.io/name: dashboard-db-gateway-agent
    app.kubernetes.io/part-of: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard-db-gateway-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard-db-gateway-agent
        app.kubernetes.io/part-of: dashboard
    spec:
      serviceAccountName: kms-app-sa
      containers:
        - name: agent
          image: reghk.hashex.vip/test/dashboard-db-gateway-agent:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: dashboard-db-gateway-agent-config
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace

            # Canonical runtime env names (mapped from dotted config keys)
            - name: DB_MYSQL_URL
              valueFrom:
                configMapKeyRef:
                  name: dashboard-db-gateway-agent-config
                  key: datasource.url
            - name: DB_MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: dashboard-db-gateway-agent-config
                  key: datasource.username
            - name: DB_MYSQL_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: dashboard-db-gateway-agent-config
                  key: datasource.password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: dashboard-db-gateway-agent-config
                  key: redis.host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: dashboard-db-gateway-agent-config
                  key: redis.port
            - name: REDIS_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: dashboard-db-gateway-agent-config
                  key: redis.database
            - name: REDIS_SSL
              valueFrom:
                configMapKeyRef:
                  name: dashboard-db-gateway-agent-config
                  key: redis.ssl
            - name: REDIS_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: dashboard-db-gateway-agent-config
                  key: redis.password
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: dashboard-db-gateway-agent-config
                  key: mongo.uri
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      terminationGracePeriodSeconds: 30
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashboard-db-gateway-agent-ingress-manager
  labels:
    app.kubernetes.io/name: dashboard-db-gateway-agent
    app.kubernetes.io/part-of: dashboard
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-db-gateway-agent-ingress-manager
  labels:
    app.kubernetes.io/name: dashboard-db-gateway-agent
    app.kubernetes.io/part-of: dashboard
subjects:
  - kind: ServiceAccount
    name: kms-app-sa
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard-db-gateway-agent-ingress-manager
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-db-gateway-agent
  namespace: default
  labels:
    app.kubernetes.io/name: dashboard-db-gateway-agent
    app.kubernetes.io/part-of: dashboard
spec:
  selector:
    app.kubernetes.io/name: dashboard-db-gateway-agent
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
