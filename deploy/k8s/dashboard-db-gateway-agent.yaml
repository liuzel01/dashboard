apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-db-gateway-agent-config
  namespace: default
  labels:
    app.kubernetes.io/name: dashboard-db-gateway-agent
    app.kubernetes.io/part-of: dashboard
data:
  LOG_LEVEL: "info"
  AGENT_ENVIRONMENT_ID: "mgbx"
  AWS_REGION: "ap-southeast-1"
  CONFIG_CACHE_TTL_MS: "300000"
  QUERY_TIMEOUT_MS: "15000"
  DB_READONLY_DEFAULT: "true"
  AGENT_DECRYPT_PROVIDER: "kms"
  AGENT_KMS_VALUE_PREFIX: "kms://"
  AGENT_KMS_DECRYPT_TIMEOUT_MS: "8000"

  # Default decrypt profile (used when AGENT_DECRYPT_ENV_CONFIGS has no matching environmentId)
  KMS_KEY_ALIAS: "alias/kms-eks-default"
  KMS_CONTEXT: '{"Environment":"default","Source":"backend","DataType":"config-password"}'

  # Environment-specific decrypt profile map.
  # Example:
  # KMS_KEY_ALIAS="alias/kms-eks-hash"
  # KMS_CONTEXT='{"Environment":"hash","Source":"backend","DataType":"config-password"}'
  AGENT_DECRYPT_ENV_CONFIGS: '{"hash":{"provider":"kms","region":"ap-southeast-1","kmsKeyAlias":"alias/kms-eks-hash","kmsContext":{"Environment":"hash","Source":"backend","DataType":"config-password"},"valuePrefix":"kms://"}}'

  # Dedicated datasource configs for dashboard-db-gateway-agent.
  datasource.url: "jdbc:mysql://meganew.c786smwyy2x7.ap-southeast-1.rds.amazonaws.com/spot?useUnicode=true&characterEncoding=utf-8&serverTimeZone=UTC&useSSL=false"
  datasource.username: "usernamename"
  datasource.password: "Q9#vE8mT!2xPa4Hr"

  redis.host: "master.megatiger.ijxpl8.qqqq"
  redis.port: "6379"
  redis.database: "0"
  redis.ssl: "true"
  redis.password: "NKA*cmexxxx"

  mongo.uri: "mongodb://megauuaa:xxxxx@172.31.23.137:27017,172.31.22.44:27017,172.31.27.168:27017/spot?replicaSet=mongo-repl&readPreference=secondaryPreferred&ssl=false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-db-gateway-agent
  namespace: default
  labels:
    app.kubernetes.io/name: dashboard-db-gateway-agent
    app.kubernetes.io/part-of: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard-db-gateway-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard-db-gateway-agent
        app.kubernetes.io/part-of: dashboard
    spec:
      serviceAccountName: kms-app-sa
      containers:
        - name: agent
          # CLI/debug pod baseline. For production, build a dedicated image with fixed client versions.
          image: ubuntu:22.04
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -e
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl jq dnsutils iputils-ping netcat-openbsd telnet \
                default-mysql-client redis-tools
              echo "dashboard-db-gateway-agent is ready"
              sleep infinity
          envFrom:
            - configMapRef:
                name: dashboard-db-gateway-agent-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace

            # Canonical runtime env names (mapped from dotted config keys)
            - name: DB_MYSQL_URL
              valueFrom:
                configMapKeyRef:
                  name: dashboard-db-gateway-agent-config
                  key: datasource.url
            - name: DB_MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: dashboard-db-gateway-agent-config
                  key: datasource.username
            - name: DB_MYSQL_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: dashboard-db-gateway-agent-config
                  key: datasource.password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: dashboard-db-gateway-agent-config
                  key: redis.host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: dashboard-db-gateway-agent-config
                  key: redis.port
            - name: REDIS_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: dashboard-db-gateway-agent-config
                  key: redis.database
            - name: REDIS_SSL
              valueFrom:
                configMapKeyRef:
                  name: dashboard-db-gateway-agent-config
                  key: redis.ssl
            - name: REDIS_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: dashboard-db-gateway-agent-config
                  key: redis.password
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: dashboard-db-gateway-agent-config
                  key: mongo.uri
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      terminationGracePeriodSeconds: 30
